apiVersion: gh-infra/v1
kind: RepositorySet
metadata:
  owner: y-maeda1116

defaults:
  spec:
    visibility: public
    archived: false
    labels:
      # --- GitHub デフォルトラベル ---
      - name: bug
        description: Something isn't working
        color: d73a4a
      - name: documentation
        description: Improvements or additions to documentation
        color: 0075ca
      - name: duplicate
        description: This issue or pull request already exists
        color: cfd3d7
      - name: enhancement
        description: New feature or request
        color: a2eeef
      - name: good first issue
        description: Good for newcomers
        color: 7057ff
      - name: help wanted
        description: Extra attention is needed
        color: 008672
      - name: invalid
        description: This doesn't seem right
        color: e4e669
      - name: question
        description: Further information is requested
        color: d876e3
      - name: wontfix
        description: This will not be worked on
        color: ffffff
      # --- 追加共通ラベル ---
      - name: Amazon Q development agent
        description: Generate new features or iterate code based on issue descriptions and comments.
        color: 008dff
    features:
      issues: true
      projects: true
      wiki: true
      discussions: false
    merge_strategy:
      allow_merge_commit: true
      allow_squash_merge: true
      allow_rebase_merge: true
      auto_delete_head_branches: true
      squash_merge_commit_title: COMMIT_OR_PR_TITLE
      squash_merge_commit_message: COMMIT_MESSAGES
      merge_commit_title: MERGE_MESSAGE
      merge_commit_message: PR_TITLE
    release_immutability: false
    rulesets:
      - name: protect-main
        target: branch
        enforcement: active
        conditions:
          ref_name:
            include:
              - refs/heads/main
        rules:
          non_fast_forward: true
          deletion: true
    actions:
      enabled: true
      allowed_actions: all
      sha_pinning_required: true
      workflow_permissions: read
      can_approve_pull_requests: false
      fork_pr_approval: first_time_contributors

repositories:
  - name: my-github-config

  - name: Weekly-Task-Board
    spec:
      description: 見積もり時間に基づいて週の過負荷を自動警告する、GitHub Pages対応のウィークリータスクボード。ローカルストレージで動作。

