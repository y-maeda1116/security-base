name: CodeQL

# SAST (Scorecard SASTID) 対応。src/ (Python) と tools/sync (Go) を解析し、
# 結果を Security タブにアップロードする。push / PR / 週次で実行。

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '43 20 * * 1' # 毎週月曜 20:43 UTC (scorecard.yml の 20:37 とずらす)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    permissions:
      # 解析結果 (SARIF) を Security タブへアップロードするため
      security-events: write
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: python
          - language: go
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      # ルートに go.mod はなく、Goモジュールは tools/sync 配下のみ。
      # go.mod が 1.26.1 を要求するため、ランナー既定のGoに依らず明示セットアップする。
      - name: Set up Go
        if: matrix.language == 'go'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: 1.26.x
          check-latest: true
          cache-dependency-path: tools/sync/go.sum

      - name: Initialize CodeQL
        uses: github/codeql-action/init@416ff0dea110f80f0f56f0046500dbf7420e4bb0 # codeql-bundle-v2.27.1
        with:
          languages: ${{ matrix.language }}

      # Go はビルド時にコードを抽出するため、モジュールのある tools/sync でビルドする。
      - name: Build Go module
        if: matrix.language == 'go'
        working-directory: tools/sync
        run: go build ./...

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@416ff0dea110f80f0f56f0046500dbf7420e4bb0 # codeql-bundle-v2.27.1
        with:
          category: /language:${{ matrix.language }}
