version: "2"

run:
  timeout: 5m

linters:
  enable:
    - gosec
    - errcheck
    - govet
    - staticcheck
    - unused
    - ineffassign
  settings:
    gosec:
      severity: medium
      confidence: medium
      excludes:
        - G104
    errcheck:
      check-type-assertions: true
      # `_ =` 代入も検出する。意図的なエラー無視は `_ =` + 行末 `//nolint:errcheck`
      # で箇所を明示する (検出無効化を広げないため)。
      check-blank: true
  exclusions:
    rules:
      # テストコードの errcheck は除外 (信頼されたフィクスチャ検証での _ = が多いため)。
      # gosec はファイルI/O系 (G301/G304/G306) のみ除外し、それ以外は本番コードと
      # 同様に検査する。v2 では issues.exclude-rules ではなく linters.exclusions.rules。
      - path: _test\.go
        linters:
          - errcheck
      - path: _test\.go
        linters:
          - gosec
        text: 'G30[146]'

# output: v2 デフォルト (colored-line-number, linter名・行番号表示) を使用。
# 旧リスト形式の formats は v2.11+ で 'output.formats expected a map' エラーになるため削除。

issues:
  max-issues-per-linter: 50
  max-same-issues: 10
